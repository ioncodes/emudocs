[project]
site_name = "emudocs"
site_url = "https://emudocs.layle.dev/"
repo_url = "https://github.com/ioncodes/emudocs"

nav = [
  "index.md",
  { "GBA" = [
    "GBA/PPU.md",
  ] },
  { "GameCube & Wii" = [
    "GameCube & Wii/Games.md",
    "GameCube & Wii/GX.md",
    "GameCube & Wii/Memory.md",
    { "Starlet" = [
      "GameCube & Wii/Starlet/index.md",
      "GameCube & Wii/Starlet/boot0.md",
      "GameCube & Wii/Starlet/boot1.md",
      "GameCube & Wii/Starlet/boot2.md",
      "GameCube & Wii/Starlet/bootmii.md",
      "GameCube & Wii/Starlet/homebrew-channel.md",
      "GameCube & Wii/Starlet/hackmii.md",
      "GameCube & Wii/Starlet/nand.md",
      "GameCube & Wii/Starlet/seeprom.md",
      { "IOS" = [
        "GameCube & Wii/Starlet/ios/index.md",
        "GameCube & Wii/Starlet/ios/ohci.md",
        "GameCube & Wii/Starlet/ios/ehci.md",
        "GameCube & Wii/Starlet/ios/sdi.md",
        "GameCube & Wii/Starlet/ios/so.md",
        { "WL" = [
          "GameCube & Wii/Starlet/ios/wl/index.md",
          "GameCube & Wii/Starlet/ios/wl/microcode-hle.md",
        ] },
        "GameCube & Wii/Starlet/ios/ncd.md",
      ] },
    ] },
  ] },
  { "PSX" = [
    "PSX/BIOS.md",
    "PSX/Games.md",
    "PSX/GPU.md",
  ] },
]

[project.theme]
variant = "modern"
features = [
  "navigation.top",
  "search.highlight",
  "search.suggest",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "header.autohide",
  "palette.toggle",
  "navigation.sections",
  "navigation.instant",
  "navigation.indexes",
]

[project.theme.icon]
logo = "material/chip"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep-purple"
accent = "deep-purple"
toggle = { icon = "material/toggle-switch-off-outline", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep-purple"
accent = "deep-purple"
toggle = { icon = "material/toggle-switch", name = "Switch to light mode" }

[project.plugins.search]

[project.markdown_extensions]
"admonition" = {}
"pymdownx.caret" = {}
"pymdownx.critic" = {}
"pymdownx.highlight" = {}
"pymdownx.keys" = {}
"pymdownx.mark" = {}
"pymdownx.superfences" = {}
"pymdownx.tasklist" = {}
"pymdownx.tilde" = {}
