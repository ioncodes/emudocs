[project]
site_name = "emudocs"
site_url = "https://emudocs.layle.dev/"
repo_url = "https://github.com/ioncodes/emudocs"

[project.theme]
variant = "modern"
features = [
  "navigation.top",
  "search.highlight",
  "search.suggest",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "header.autohide",
  "palette.toggle",
  "navigation.sections",
  "navigation.instant",
]

[project.theme.icon]
logo = "material/nintendo-game-boy"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep-purple"
accent = "deep-purple"
toggle = { icon = "material/toggle-switch-off-outline", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep-purple"
accent = "deep-purple"
toggle = { icon = "material/toggle-switch", name = "Switch to light mode" }

[project.plugins.search]

[project.markdown_extensions]
"pymdownx.caret" = {}
"pymdownx.critic" = {}
"pymdownx.highlight" = {}
"pymdownx.keys" = {}
"pymdownx.mark" = {}
"pymdownx.superfences" = {}
"pymdownx.tasklist" = {}
"pymdownx.tilde" = {}
